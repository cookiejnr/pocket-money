// ---------- family sync (Firebase Auth + Firestore, via their REST APIs) ----------
var FB={apiKey:'AIzaSyAxARu5ENphFdVn5feP4kKmZbTNS2HAWEI',projectId:'budget-envelopes-16279'};
var SESSKEY='budgetEnvelopes.session', SYNCKEY='budgetEnvelopes.sync';
var sess=null, idTok=null, idExp=0, sync={ut:null,dirty:false}, busy=false, pushT=null, lastOk=0;
function fbReady(){return FB.apiKey.indexOf('__')!==0;}
function lsGet(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){return null;}}
function lsSet(k,v){try{if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function slug(n){return String(n).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function famEmail(n){return slug(n)+'@family.budget-envelopes.app';}
function famPass(n,pin){return 'env-'+pin+'-'+slug(n);}
function docUrl(){return 'https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents/families/'+sess.uid;}
function jfetch(url,opt){
  return fetch(url,opt).then(function(r){return r.text().then(function(t){var j={};try{j=t?JSON.parse(t):{};}catch(e){} return {ok:r.ok,status:r.status,j:j};});});
}
function errOf(res){var e=res.j&&res.j.error; var m=(e&&(typeof e==='string'?e:e.message))||('HTTP '+res.status); var x=new Error(m); x.status=e&&e.status; return x;}
function idt(path,body){
  return jfetch('https://identitytoolkit.googleapis.com/v1/'+path+'?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(res){if(!res.ok) throw errOf(res); return res.j;});
}
function token(){
  if(idTok&&Date.now()<idExp-60000) return Promise.resolve(idTok);
  return jfetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(sess.rt)})
    .then(function(res){
      if(!res.ok){var e=errOf(res); e.auth=/TOKEN_EXPIRED|USER_DISABLED|USER_NOT_FOUND|INVALID_REFRESH_TOKEN|INVALID_GRANT_TYPE/.test(e.message); throw e;}
      idTok=res.j.id_token; idExp=Date.now()+Number(res.j.expires_in||3600)*1000;
      if(res.j.refresh_token&&res.j.refresh_token!==sess.rt){sess.rt=res.j.refresh_token; lsSet(SESSKEY,sess);}
      return idTok;
    });
}
function fsGet(){
  return token().then(function(t){return jfetch(docUrl(),{headers:{Authorization:'Bearer '+t}});}).then(function(res){
    if(res.status===404) return null;
    if(!res.ok) throw errOf(res);
    var d=JSON.parse(res.j.fields.data.stringValue); if(!valid(d)) throw new Error('Bad data in the cloud');
    return {ut:res.j.updateTime,data:d,family:res.j.fields.family&&res.j.fields.family.stringValue};
  });
}
function fsPut(force){
  var q=force?'':(sync.ut?'?currentDocument.updateTime='+encodeURIComponent(sync.ut):'?currentDocument.exists=false');
  var body=JSON.stringify({fields:{data:{stringValue:JSON.stringify(S)},family:{stringValue:sess.name}}});
  return token().then(function(t){return jfetch(docUrl()+q,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body});}).then(function(res){
    if(res.ok) return {ok:true,ut:res.j.updateTime};
    var st=res.j.error&&res.j.error.status;
    if(res.status===409||st==='FAILED_PRECONDITION'||st==='ALREADY_EXISTS'||st==='NOT_FOUND') return {ok:false};
    throw errOf(res);
  });
}
// Merge another device's copy into ours. Keeps our objects so anything open on screen stays valid.
function merge(L,R){
  function ids(k){var a=((L.deleted||{})[k]||[]).concat((R.deleted||{})[k]||[]);return a.filter(function(x,i){return a.indexOf(x)===i;});}
  var del={counts:ids('counts'),moves:ids('moves'),fns:ids('fns')};
  var lNew=(L.envsM||0)>=(R.envsM||0), A=lNew?L.envs:R.envs, B=lNew?R.envs:L.envs, envs=A.slice();
  B.forEach(function(e){if(!envs.some(function(x){return x.id===e.id;})) envs.push(e);});
  var fmap={}; L.fns.forEach(function(f){fmap[f.id]=f;});
  R.fns.forEach(function(rf){
    var lf=fmap[rf.id]; if(!lf){fmap[rf.id]=rf;return;}
    if((rf.m||0)>(lf.m||0)){['start','base','m','swept','sweptFrom','prevLeft'].forEach(function(k){lf[k]=rf[k];});}
    rf.moves.forEach(function(mv){if(!lf.moves.some(function(x){return x.id===mv.id;})) lf.moves.push(mv);});
    lf.moves.sort(function(a,b){return a.ts-b.ts;});
  });
  var fns=Object.keys(fmap).map(function(k){return fmap[k];}).filter(function(f){return del.fns.indexOf(f.id)<0;});
  fns.forEach(function(f){f.moves=f.moves.filter(function(mv){return del.moves.indexOf(mv.id)<0;});});
  fns.sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:a.id-b.id;});
  var cmap={}; L.counts.forEach(function(c){cmap[c.id]=c;});
  R.counts.forEach(function(rc){var lc=cmap[rc.id]; if(!lc){cmap[rc.id]=rc;return;} for(var k in rc.vals) if(!lc.vals[k]) lc.vals[k]=rc.vals[k];});
  var fidOk={}; fns.forEach(function(f){fidOk[f.id]=1;});
  var counts=Object.keys(cmap).map(function(k){return cmap[k];}).filter(function(c){return del.counts.indexOf(c.id)<0&&fidOk[c.fid];}).sort(function(a,b){return a.ts-b.ts;});
  var pinL=(L.pinM||0)>=(R.pinM||0);
  return {v:1,envs:envs,fns:fns.length?fns:L.fns,counts:counts,pin:pinL?L.pin:R.pin,pinM:Math.max(L.pinM||0,R.pinM||0),
    setup:!!(L.setup||R.setup),envsM:Math.max(L.envsM||0,R.envsM||0),nextId:Math.max(L.nextId||0,R.nextId||0),deleted:del};
}
function setSync(s){
  var el=$('eSync'); if(!el) return;
  if(!sess){el.textContent='';return;}
  var t=lastOk?new Date(lastOk).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}):'';
  el.className='e-sync '+s;
  el.textContent=s==='ok'?'☁️ '+sess.name+' · synced '+t:s==='saving'?'☁️ Saving…':s==='offline'?'📴 Offline · changes will sync later':'⚠️ Couldn\'t sync · tap to retry';
}
function fail(e){
  busy=false;
  if(e&&e.auth){disconnect(true);return;}
  setSync(navigator.onLine?'error':'offline');
  try{console.warn('[envelopes sync]',e&&e.message);}catch(x){}
}
function schedulePush(){if(!sess) return; clearTimeout(pushT); setSync('saving'); pushT=setTimeout(function(){pushNow(false);},700);}
function pushNow(force){
  if(!sess) return Promise.resolve();
  if(busy){schedulePush();return Promise.resolve();}
  if(!navigator.onLine){setSync('offline');return Promise.resolve();}
  busy=true; setSync('saving');
  var tries=0;
  function attempt(){
    return fsPut(force).then(function(res){
      if(res.ok){sync.ut=res.ut;sync.dirty=false;lsSet(SYNCKEY,sync);busy=false;lastOk=Date.now();setSync('ok');return;}
      if(++tries>3) throw new Error('Kept clashing with another device');
      return fsGet().then(function(rem){
        if(rem){S=merge(S,rem.data); sync.ut=rem.ut; saveLocal(); if(!M) render(); else renderSide();}
        else sync.ut=null;
        return attempt();
      });
    });
  }
  return attempt().catch(fail);
}
function pull(){
  if(!sess||busy||M||!navigator.onLine){if(sess&&!navigator.onLine) setSync('offline');return Promise.resolve();}
  busy=true;
  return fsGet().then(function(rem){
    busy=false;
    if(!rem){sync.ut=null;sync.dirty=true;lsSet(SYNCKEY,sync);return pushNow(false);}
    if(rem.ut!==sync.ut){
      S=sync.dirty?merge(S,rem.data):rem.data; sync.ut=rem.ut; lsSet(SYNCKEY,sync); saveLocal(); render();
    }
    if(sync.dirty) return pushNow(false);
    lastOk=Date.now(); setSync('ok');
  }).catch(fail);
}
