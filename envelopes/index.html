<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget Envelopes">
<meta name="theme-color" content="#fdf3e6">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Budget Envelopes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf3e6; --ink:#3a2a22; --muted:#957f6e; --card:#ffffff; --line:#f3e6d6; --zebra:#fffaf3;
  --pink:#17a06b; --pinkdark:#0f7a50; --pinksoft:#e9f7f0;
  --up:#17914b; --down:#d23d3d; --shadow:0 8px 24px rgba(110,70,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);
  background:radial-gradient(#f2e2cd 1.2px,transparent 1.3px) 0 0/22px 22px, linear-gradient(160deg,#fff8ef 0%,#fdeedd 100%);
  font-family:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.app{display:grid;grid-template-columns:310px 1fr;gap:18px;padding:16px 18px;height:100vh;height:100dvh;
  padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}

/* ---------- side ---------- */
.side{display:flex;flex-direction:column;gap:14px;min-height:0}
h1{font-size:26px;font-weight:700;margin:2px 0 0;line-height:1.05}
h1 small{display:block;font-size:15px;font-weight:500;color:var(--muted)}
h1 span{color:var(--pink)}
.stats{background:var(--card);border-radius:24px;padding:14px 18px;box-shadow:var(--shadow)}
.stats .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.stats .big{font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.5px}
.stats .last{font-size:15px;margin-top:6px;line-height:1.45;color:#5d4a3e}
.chg{font-weight:600;white-space:nowrap}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.same{color:var(--muted);font-weight:500}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{border:0;border-radius:18px;padding:13px 8px;font-size:18px;font-weight:600;background:#fff;
  box-shadow:0 4px 0 #ead6bf,0 8px 16px rgba(110,70,30,.08);transition:transform .06s,box-shadow .06s}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 #ead6bf,0 3px 8px rgba(110,70,30,.08)}
.act.primary{grid-column:1 / -1;color:#fff;font-size:21px;padding:16px;background:linear-gradient(#2fbf85,#17a06b);box-shadow:0 5px 0 var(--pinkdark),0 10px 18px rgba(15,122,80,.25)}
.act.primary:active{box-shadow:0 1px 0 var(--pinkdark)}
.act.on{background:var(--down);color:#fff;box-shadow:0 4px 0 #a52a2a}
.act.nudge{animation:nudge .5s ease 2}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.side-foot{margin-top:auto}
.gear{background:none;border:0;color:var(--muted);font-size:14px;padding:6px 2px;text-decoration:underline}
.warn{font-size:13px;color:var(--down);display:none}
.warn.show{display:block}

/* ---------- board ---------- */
.board{background:var(--card);border-radius:24px;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch;position:relative;box-shadow:var(--shadow);outline:3px solid transparent;transition:outline-color .2s}
.board.minus{outline-color:var(--down)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{text-align:center;padding:0}
thead th{position:sticky;top:0;background:#fff;z-index:3;height:56px;font-weight:600;font-size:15px;padding:0 10px;white-space:nowrap;border-bottom:2px solid var(--line)}
thead th.corner{left:0;z-index:4;text-align:left;padding-left:18px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.8px}
thead .when{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
thead th.col-active{background:#fff}
thead th.col-active .chip{display:inline-block;background:var(--pink);color:#fff;padding:3px 10px;border-radius:12px;font-size:14px}
thead th.col-active .when{color:var(--pinkdark)}
tbody tr:nth-child(even) td,tbody tr:nth-child(even) th.denom{background:var(--zebra)}
th.denom{position:sticky;left:0;background:#fff;z-index:2;width:156px;min-width:156px;height:61px;padding:0 6px;border-right:2px solid var(--line)}
.money{border:0;background:none;padding:0;width:100%;height:60px;display:flex;align-items:center;justify-content:center;position:relative}
.money svg{display:block;filter:drop-shadow(0 3px 3px rgba(80,50,20,.22));transition:transform .08s}
.money:active svg{transform:scale(.9)}
.money.pop svg{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15) rotate(-4deg)}100%{transform:scale(1)}}
.minus .money::after{content:'−';position:absolute;right:2px;top:50%;transform:translateY(-50%);background:var(--down);color:#fff;
  width:22px;height:22px;border-radius:11px;font-size:18px;line-height:21px;font-weight:700}
td.cell{min-width:100px;width:100px;height:61px}
td.cell .n{font-size:24px;font-weight:600;line-height:1;display:inline-block}
td.cell .v{font-size:12px;color:var(--muted);margin-top:3px}
td.cell .z{color:#e3d4c3;font-size:20px}
tbody td.col-active,tbody tr:nth-child(even) td.col-active{background:var(--pinksoft)}
tbody tr:nth-child(even) td.col-active{background:#e1f4ea}
.pulse{animation:pulse .35s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
tr.total th,tr.total td{height:66px;border-top:2px solid var(--line);background:#fff}
tr.total th{position:sticky;left:0;z-index:2;text-align:left;padding-left:18px;font-size:20px;font-weight:700;border-right:2px solid var(--line)}
tr.total td .tt{font-size:21px;font-weight:700;display:inline-block}
tr.total td .tc{font-size:13px;margin-top:3px}
tr.total td.col-active{background:var(--pinksoft)}
.fill{width:100%;min-width:0}
.empty{position:absolute;inset:56px 0 0 162px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:20px;line-height:1.5;pointer-events:none}

/* ---------- toast & modal ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,140px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:16px;
  font-size:17px;font-weight:500;transition:transform .25s ease;z-index:80;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(58,42,34,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:26px;padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto;-webkit-user-select:text;user-select:text;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 8px;font-size:25px}
.modal p{margin:6px 0 16px;font-size:16px;color:#5b4a3e;line-height:1.45}
.mrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mbtn{border-radius:14px;padding:12px 18px;font-size:17px;font-weight:600;border:0;background:#f6ede2}
.mbtn.go{background:var(--pink);color:#fff}
.mbtn.danger{background:var(--down);color:#fff}
.clist{list-style:none;padding:0;margin:0 0 16px}
.clist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.clist .mbtn{padding:6px 12px;font-size:14px}
textarea{width:100%;height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:2px solid var(--line);border-radius:12px;padding:8px}
.sec{font-weight:600;margin:14px 0 6px;font-size:15px}
.note{font-size:13px;color:var(--muted)}
.act.print{grid-column:1 / -1;background:#fff}

/* ---------- print view ---------- */
#printView{display:none}
@page{size:A4 portrait;margin:12mm}
@media print{#printView{max-height:273mm;overflow:hidden;break-inside:avoid;page-break-inside:avoid}}
@media print{
  html,body{background:#fff !important;height:auto}
  .app,.toast,.overlay{display:none !important}
  #printView{display:block;color:#2e2219;font-family:'Fredoka',ui-rounded,system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.p-head{display:flex;align-items:center;gap:14px;padding-bottom:10px;border-bottom:3px solid #17a06b;margin-bottom:14px}
.p-title{font-size:26pt;font-weight:700;line-height:1}
.p-title span{color:#0f7a50}
.p-sub{font-size:10.5pt;color:#7a6556;margin-top:4px}
.p-sum{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-bottom:16px}
.p-box{border:1.5px solid #ecdcc9;border-radius:12px;padding:9px 12px}
.p-box .l{font-size:8.5pt;text-transform:uppercase;letter-spacing:.7px;color:#7a6556;font-weight:600}
.p-box .b{font-size:20pt;font-weight:700;line-height:1.15}
.p-box .s{font-size:10pt;color:#5d4a3e}
.p-box.main{background:#e9f7f0;border-color:#a8e0c4}
.p-box.main .b{font-size:26pt}
.p-h2{font-size:13pt;font-weight:600;margin:6px 0 6px}
.p-table{width:100%;border-collapse:collapse;font-size:10.5pt;margin-bottom:16px}
.p-table th,.p-table td{border-bottom:1px solid #eee2d4;padding:3px 6px;text-align:center}
.p-table thead th{font-size:10pt;font-weight:600;border-bottom:2px solid #d9c6b2;padding:6px}
.p-table thead th.now{color:#0f7a50}
.p-table th.d{text-align:left;width:150px;font-weight:500;white-space:nowrap}
.p-table th.d .ic{display:inline-flex;width:62px;justify-content:center;vertical-align:middle;margin-right:6px}
.p-table th.d svg{display:block}
.p-table td .n{font-size:12pt;font-weight:600}
.p-table td .v{font-size:8pt;color:#8a7565}
.p-table td.z{color:#cdbca9}
.p-table td.now{background:#f0faf5}
.p-table tr.tot th,.p-table tr.tot td{font-size:12.5pt;font-weight:700;border-top:2px solid #d9c6b2;padding:7px 6px}
.p-table tr.chg td,.p-table tr.chg th{font-size:9.5pt;border-bottom:0}
.p-table .up{color:#17914b;font-weight:600}.p-table .down{color:#d23d3d;font-weight:600}.p-table .same{color:#8a7565}
.p-chart svg{width:100%;height:auto;display:block}
.p-foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:10pt;color:#7a6556;border-top:1.5px dashed #ecdcc9;padding-top:8px}
.p-foot b{color:#0f7a50;font-size:13pt}
.p-note{font-size:9pt;color:#8a7565;margin:-10px 0 14px}

@media (max-aspect-ratio: 1/1), (max-width: 860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
}
.titlebar{display:flex;flex-direction:column;gap:8px}

input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit}

/* ---------- envelopes: side ---------- */
.envapp .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.e-card2{background:var(--card);border-radius:24px;padding:14px 18px;box-shadow:var(--shadow)}
.e-dates{font-size:19px;font-weight:600;margin-top:2px}
.e-dots{display:flex;gap:4px;margin:10px 0 8px}
.e-dots i{flex:1;height:10px;border-radius:5px;background:#f1e4d4}
.e-dots i.done{background:#b5e6cf}
.e-dots i.today{background:var(--pink);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pink)}
.e-due{font-size:15px;color:#5d4a3e;line-height:1.35}
.e-due.now{color:var(--pinkdark);font-weight:700}
.e-big{font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-.5px}
.e-mini{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-top:7px;color:#5d4a3e}
.e-mini b{font-size:17px;color:var(--ink)}
.act.due{background:linear-gradient(#ffe27a,#ffc93c);box-shadow:0 4px 0 #d9a21c,0 8px 16px rgba(217,162,28,.25);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08)}}

/* ---------- envelopes: main ---------- */
.e-main{display:flex;flex-direction:column;min-height:0;gap:12px}
.e-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.e-tabs button{border:0;background:#fff;border-radius:14px;padding:10px 18px;font-size:17px;font-weight:600;box-shadow:0 3px 0 #ead6bf}
.e-tabs button.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #1d140f}
.e-tabs .sp{flex:1}
.e-tabs .hint{font-size:14px;color:var(--muted)}
.e-view{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:24px;position:relative}
.e-view.tbl{background:#fff;box-shadow:var(--shadow)}
.e-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px;padding:4px 4px 24px}

.e-card{position:relative;border:0;text-align:left;background:#fff;border-radius:18px;padding:50px 16px 14px;box-shadow:var(--shadow);
  overflow:hidden;min-height:196px;display:flex;flex-direction:column;transition:transform .08s}
.e-card:active{transform:scale(.97)}
.e-card::before{content:'';position:absolute;left:0;right:0;top:0;height:42px;background:var(--c);clip-path:polygon(0 0,100% 0,50% 100%)}
.e-card::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c);opacity:.55}
.e-stamp{position:absolute;right:11px;top:9px;width:44px;height:50px;background:#fff;border:2px dashed var(--c);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:25px;transform:rotate(5deg);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.e-name{font-size:19px;font-weight:700;line-height:1.1;padding-right:42px}
.e-left{font-size:33px;font-weight:700;margin-top:6px;letter-spacing:-.5px;line-height:1.1}
.e-of{font-size:14px;color:var(--muted)}
.e-bar{height:12px;border-radius:6px;background:#f3e8db;margin:10px 0 9px;overflow:hidden}
.e-bar i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .4s}
.e-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#5d4a3e;gap:6px;flex-wrap:wrap}
.e-pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:#f6ede2;color:#7a6556;white-space:nowrap}
.e-pill.keep{background:#e3f4ea;color:#17703d}
.e-for{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
.e-card.low .e-left{color:var(--down)}
.e-card.sav{grid-column:span 2;background:linear-gradient(135deg,#fff 0%,#e9f7f0 100%)}
.e-card.sav .e-left{font-size:44px;color:var(--pinkdark)}
.e-savrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:#5d4a3e}
.e-savrow b{display:block;font-size:19px;color:var(--ink)}
.e-empty{padding:30px;text-align:center;color:var(--muted);font-size:18px}

/* ---------- envelopes: counts table ---------- */
.e-table thead tr.band th{height:30px;top:0;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);background:#fffaf3;border-bottom:1px solid var(--line);font-weight:600}
.e-table thead tr.dates th{top:30px;height:54px}
.e-table thead tr.band th.corner,.e-table thead tr.dates th.corner{left:0;z-index:5}
.e-table thead tr.band th.cur{color:var(--pinkdark);background:#eef9f3}
.e-table .gs{border-left:3px solid #efdcc6}
.e-table th.env{position:sticky;left:0;background:#fff;z-index:2;min-width:196px;text-align:left;padding:6px 12px;border-right:2px solid var(--line);height:64px}
.e-table tbody tr:nth-child(even) th.env{background:var(--zebra)}
.e-table tr.arch th.env{opacity:.55}
.e-rowh{display:flex;align-items:center;gap:10px}
.e-dot{flex:none;width:38px;height:38px;border-radius:11px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:21px}
.e-rowh b{display:block;font-size:16px;line-height:1.15}
.e-rowh small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.e-table td.ec{min-width:116px;height:64px;padding:0 6px}
.e-table td.ec .a{font-size:20px;font-weight:600;display:inline-block}
.e-table td.ec .d{font-size:12px;margin-top:2px}
.e-table td.ec .z{color:#e3d4c3;font-size:20px}
.e-table td.st{background:repeating-linear-gradient(45deg,#fffdf9,#fffdf9 7px,#fbf2e6 7px,#fbf2e6 14px) !important;color:#6d5848}
.e-table td.tap{cursor:pointer}
.e-table td.tap:active{background:#cdeedd !important}
.e-table tr.savr th.env{background:#eef9f3}
.e-table tr.savr td{background:#f6fcf9}
.tapme{display:inline-block;font-size:13px;font-weight:600;color:var(--pinkdark);background:#fff;border:2px dashed #9fdcbf;padding:6px 10px;border-radius:12px}
.e-table tr.total td .sub{font-size:11px;color:var(--muted)}
.e-table thead .stl{font-size:14px;color:var(--muted)}

/* ---------- envelopes: modals ---------- */
.modal.wide{max-width:680px}
.modal.xwide{max-width:860px}
.e-mhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.e-mhead .e-dot{width:48px;height:48px;font-size:27px;border-radius:14px}
.e-mhead h2{margin:0;font-size:24px;line-height:1.1}
.e-mhead .sub{font-size:14px;color:var(--muted)}
.e-mhead .x{margin-left:auto;border:0;background:#f6ede2;border-radius:12px;width:40px;height:40px;font-size:20px;flex:none}
.e-info{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.e-info div{background:#fffaf3;border:1.5px solid var(--line);border-radius:14px;padding:7px 12px;font-size:13px;color:var(--muted)}
.e-info b{display:block;font-size:18px;color:var(--ink)}
.seg{display:flex;gap:6px;margin:12px 0}
.seg button{flex:1;border:0;border-radius:14px;padding:11px 8px;font-size:16px;font-weight:600;background:#f6ede2;color:#6d5848}
.seg button.on{background:var(--ink);color:#fff}
.pad-disp{font-size:50px;font-weight:700;text-align:center;background:#fffaf3;border-radius:18px;padding:8px;margin-bottom:12px;border:2px solid var(--line);letter-spacing:-.5px}
.pad-disp.fresh{color:#b9a693}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 #ead6bf,0 6px 12px rgba(110,70,30,.08);font-size:28px;font-weight:600;padding:13px 0}
.keys button:active{transform:translateY(3px);box-shadow:0 1px 0 #ead6bf}
.coins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.coins button{border:0;background:#fffaf3;border:2px solid var(--line);border-radius:14px;height:84px;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.coins button svg{display:block;filter:drop-shadow(0 2px 2px rgba(80,50,20,.2))}
.coins button:active svg{transform:scale(.9)}
.coins .cnt{position:absolute;top:4px;right:5px;background:var(--ink);color:#fff;border-radius:10px;font-size:13px;padding:1px 7px;font-weight:700}
.coins.minus button{border-color:#f3b3b3;background:#fff5f5}
.tbar{display:flex;gap:8px;margin-top:10px}
.tbar .mbtn{flex:1}
.mbtn.on{background:var(--down);color:#fff}
.mrow.sp{justify-content:space-between;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.chips button small{color:var(--muted);font-weight:500}
.chips button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chips button.on small{color:#e9dccf}
.chips button:disabled{opacity:.35}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld input[type=password],.fld input[type=date],.fld input:not([type]){width:100%;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.money-in{width:110px;font-size:16px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;text-align:right;color:var(--ink);background:#fff}
.money-in.bad{border-color:var(--down)}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo button{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;padding:0}
.emo button.on{border-color:var(--ink);background:#fff4e6}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:34px;height:34px;border-radius:17px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.tgl{border:0;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;background:#f6ede2;color:#7a6556;white-space:nowrap}
.tgl.on{background:#e3f4ea;color:#17703d}
.etbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:15px}
.etbl th,.etbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;position:static;height:auto;background:none !important;white-space:nowrap}
.etbl thead th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line)}
.etbl .l{text-align:left}
.etbl .nm{display:flex;align-items:center;gap:8px;font-weight:600;white-space:normal}
.etbl .nm .e-dot{width:30px;height:30px;font-size:17px;border-radius:9px}
.etbl tr.savt td{background:#eef9f3 !important;font-weight:700}
.etbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.etbl .arrow{color:var(--pinkdark);font-weight:700}
.glist{list-style:none;padding:0;margin:0 0 10px}
.glist li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.glist li .nm{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.glist li .e-dot{width:30px;height:30px;font-size:17px;border-radius:9px}
.glist .mbtn{padding:6px 11px;font-size:14px}
.glist .arr{padding:6px 9px;font-size:13px;background:#f6ede2}
.glist .arr:disabled{opacity:.3}
.glist .amt{color:#5d4a3e;font-size:14px;white-space:nowrap}
.callout{background:#fff8e1;border:2px solid #f5dc8a;border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.45;margin:8px 0 12px;color:#5d4a3e}
.callout.pink{background:#e9f7f0;border-color:#a8e0c4}
.party{text-align:center;padding:6px 0 4px}
.party .bigsave{font-size:58px;font-weight:700;color:var(--pinkdark);line-height:1.05;margin:6px 0}
.party .em{font-size:60px;line-height:1}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;z-index:200;pointer-events:none}
.pinpad .pin-dots{display:flex;justify-content:center;gap:14px;margin:12px 0 16px}
.pinpad .pin-dots i{width:18px;height:18px;border-radius:9px;border:2px solid var(--ink)}
.pinpad .pin-dots i.f{background:var(--ink)}
.hist{font-size:14px;color:#5d4a3e}
.hist td,.hist th{font-size:14px}

/* ---------- envelopes: print ---------- */
.p-env svg{width:78px;height:58px;display:block}
.p-bars{width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:12px}
.p-bars td{padding:3px 6px;border-bottom:1px solid #f1e6d8;vertical-align:middle}
.p-bars td.n{width:130px;white-space:nowrap;font-weight:500}
.p-bars td.v{width:150px;text-align:right;white-space:nowrap;font-size:9.5pt;color:#5d4a3e}
.p-bar{height:13px;border-radius:7px;background:#f3e8db;overflow:hidden;display:flex}
.p-bar i{display:block;height:100%}
.p-key{font-size:9pt;color:#7a6556;margin:-4px 0 8px}
.p-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}


.fld input.money-in{width:150px;display:inline-block}
.tapme{white-space:nowrap;font-size:12px}
.p-bars td.n{text-align:left}
.p-bars td.v{text-align:right}
@media (max-width: 860px){.etbl th,.etbl td{padding:6px 4px;font-size:14px}.etbl .tgl{padding:6px 8px;font-size:13px}}
.e-sync{font-size:12px;color:var(--muted);margin-top:4px;cursor:pointer;min-height:16px}
.e-sync.error{color:var(--down)} .e-sync.offline{color:#b07a1a}
.mbtn:disabled{opacity:.6}
/* ---------- envelopes: portrait ---------- */
@media (max-aspect-ratio: 1/1), (max-width: 860px){
  .titlebar{grid-area:title;flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
    .envapp .side{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"title title" "fn stats" "actions actions" "foot foot";gap:12px 16px}
  .envapp .e-fnc{grid-area:fn} .envapp .e-stc{grid-area:stats} .envapp .actions{grid-area:actions;grid-template-columns:repeat(4,1fr)}
  .envapp .actions .act.primary{grid-column:auto}
  .envapp .actions .act.print{grid-column:auto}
  .envapp .side-foot{grid-area:foot}
}
</style>
</head>
<body>
<div class="app envapp" id="envApp">
  <div class="side">
    <div class="titlebar">
      <h1>Budget <span>Envelopes</span></h1>
    </div>
    <div class="e-card2 e-fnc">
      <div class="lbl">This fortnight</div>
      <div class="e-dates" id="eDates">–</div>
      <div class="e-dots" id="eDots"></div>
      <div class="e-due" id="eDue"></div>
    </div>
    <div class="e-card2 e-stc">
      <div class="lbl">Cash in all envelopes</div>
      <div class="e-big" id="eTotal">$0.00</div>
      <div class="e-mini"><span>🐷 Main Savings</span><b id="eSav">$0.00</b></div>
      <div class="e-mini"><span>Spent this fortnight</span><b id="eSpent">$0.00</b></div>
      <div class="e-mini" style="font-size:13px;margin-top:4px"><span id="eLast">No counts yet</span></div>
    </div>
    <div class="actions">
      <button class="act primary" id="eCountBtn">New count</button>
      <button class="act" id="eMoveBtn">Move money</button>
      <button class="act" id="eFnBtn">New fortnight</button>
      <button class="act print" id="ePrintBtn">Print</button>
    </div>
    <div class="side-foot">
      <div class="warn" id="eWarn">This browser isn't saving. Ask a grown-up to make a backup.</div>
      <button class="gear" id="eGrown">Grown-ups</button>
      <div class="e-sync" id="eSync"></div>
    </div>
  </div>
  <div class="e-main">
    <div class="e-tabs">
      <button data-view="cards" class="on">Envelopes</button>
      <button data-view="counts">Counts</button>
      <span class="sp"></span>
      <span class="hint" id="eHint"></span>
    </div>
    <div class="e-view" id="eView"></div>
  </div>
</div>
<div class="overlay" id="eOv"><div class="modal" id="eMod"></div></div>
<div id="printView"></div>
<div class="toast" id="toast"></div>
<script>

var gid=0;
function head(name,x,y,size){return '<g transform="translate('+x.toFixed(2)+' '+y.toFixed(2)+') scale('+(size/100).toFixed(4)+')">'+HEADS[name]()+'</g>';}

function coinSVG(d,scale,small){
  var s=d.mm*scale, r=s/2, id='g'+(gid++);
  var silver=d.metal==='silver';
  var rimG=silver?['#ffffff','#cfd5da','#8f979e']:['#fff3b8','#e2b448','#a07118'];

  var fr=r*0.8, box=small?r*1.42:r*1.36;

    '<clipPath id="'+id+'c"><circle cx="'+r+'" cy="'+r+'" r="'+fr+'"/></clipPath></defs>'+
    shape+'<circle cx="'+r+'" cy="'+r+'" r="'+fr+'" fill="url(#'+id+'f)" stroke="'+edge+'" stroke-opacity=".35" stroke-width="'+(s*0.015).toFixed(2)+'"/>'+

  if(!small){
    var ph=Math.max(s*0.3,13), pw=Math.max(s*0.6,ph*(d.label.length>2?2.3:1.9)), px=r-pw/2, py=s-ph-s*0.01;
    out+='<rect x="'+px.toFixed(2)+'" y="'+py.toFixed(2)+'" width="'+pw.toFixed(2)+'" height="'+ph.toFixed(2)+'" rx="'+(ph/2).toFixed(2)+'" fill="'+pill+'" stroke="#fff" stroke-width="1.2"/>'+
      '<text x="'+r+'" y="'+(py+ph*0.76).toFixed(2)+'" text-anchor="middle" font-family="Fredoka,system-ui,sans-serif" font-weight="700" font-size="'+(ph*0.74).toFixed(2)+'" fill="#fff">'+d.label+'</text>';
  }
  return out+'</svg>';
}
function noteSVG(d,scale,small){
  var w=d.mm*scale, h=65*scale, id='g'+(gid++), c=d.col, mr=h*0.4, mx=h*0.56, my=h/2;
  var waves='';
  for(var i=0;i<4;i++){var y=h*(0.2+i*0.2);waves+='<path d="M'+(w*0.3)+' '+y+' Q'+(w*0.5)+' '+(y-h*0.14)+' '+(w*0.7)+' '+y+' T'+(w*1.05)+' '+y+'" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="'+(h*0.03)+'"/>';}
  var out='<svg width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset=".55" stop-color="'+c[1]+'"/><stop offset="1" stop-color="'+c[2]+'"/></linearGradient>'+
    '<clipPath id="'+id+'m"><circle cx="'+mx+'" cy="'+my+'" r="'+mr+'"/></clipPath></defs>'+
    '<rect x=".5" y=".5" width="'+(w-1)+'" height="'+(h-1)+'" rx="'+(h*0.12)+'" fill="url(#'+id+')" stroke="'+c[2]+'" stroke-width="1"/>'+waves+
    '<rect x="'+(h*0.06)+'" y="'+(h*0.06)+'" width="'+(w-h*0.12)+'" height="'+(h*0.88)+'" rx="'+(h*0.08)+'" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1"/>'+
    '<circle cx="'+mx+'" cy="'+my+'" r="'+mr+'" fill="#fffdf8" stroke="#fff" stroke-width="'+(h*0.04)+'"/>'+
    '<g clip-path="url(#'+id+'m)">'+head(d.animal,mx-mr*0.88,my-mr*0.86,mr*1.76)+'</g>';
  if(!small) out+='<text x="'+(w-h*0.14)+'" y="'+(h*0.68)+'" text-anchor="end" font-family="Fredoka,system-ui,sans-serif" font-weight="700" font-size="'+(h*(d.label.length>3?0.42:0.48))+'" fill="#fff" stroke="'+c[2]+'" stroke-width="'+(h*0.05)+'" paint-order="stroke">'+d.label+'</text>';
  return out+'</svg>';
}
function moneySVG(d,small){
  if(d.type==='coin') return coinSVG(d, small?COIN_SCALE*0.6:COIN_SCALE, small);
  return noteSVG(d, small?NOTE_SCALE*0.42:NOTE_SCALE, small);
}

function fmt(cents){return '$'+(cents/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2200);}
// ---------- sound ----------
var ac=null;
function actx(){
  if(!ac){var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ac=new C();}catch(e){return null;}}
  if(ac.state==='suspended'){try{ac.resume();}catch(e){}}
  return ac;
}
function env(a,g,t,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
var sfx={
  grunt:function(a,t,p){
    var o=a.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(150*p,t); o.frequency.exponentialRampToValueAtTime(240*p,t+0.07); o.frequency.exponentialRampToValueAtTime(105*p,t+0.24);
    var lfo=a.createOscillator(); lfo.frequency.value=34; var lg=a.createGain(); lg.gain.value=30*p; lfo.connect(lg); lg.connect(o.frequency);
    var f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=3; f.frequency.setValueAtTime(1000,t); f.frequency.linearRampToValueAtTime(550,t+0.24);
    var g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.9,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.27);
    o.connect(f); f.connect(g); g.connect(a.destination);
    o.start(t); lfo.start(t); o.stop(t+0.3); lfo.stop(t+0.3);
  },
  oink:function(){var a=actx(); if(!a) return; var t=a.currentTime+0.01; sfx.grunt(a,t,1); sfx.grunt(a,t+0.3,0.88);},
  clink:function(silver){
    var a=actx(); if(!a) return; var t=a.currentTime+0.005, base=silver?2600:2100;
    [1,1.48,2.1].forEach(function(m,i){var o=a.createOscillator();o.type='sine';o.frequency.value=base*m;var g=a.createGain();env(a,g,t,0.16/(i+1),0.3-i*0.06);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.32);});
  },
  swish:function(){
    var a=actx(); if(!a) return; var t=a.currentTime+0.005, len=Math.floor(a.sampleRate*0.22);
    var buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0); for(var i=0;i<len;i++) ch[i]=Math.random()*2-1;
    var s=a.createBufferSource(); s.buffer=buf;
    var f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2; f.frequency.setValueAtTime(1200,t); f.frequency.exponentialRampToValueAtTime(5000,t+0.2);
    var g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.06); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t+0.23);
  },
  plop:function(){
    var a=actx(); if(!a) return; var t=a.currentTime+0.005;
    var o=a.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(90,t+0.13);
    var g=a.createGain(); env(a,g,t,0.35,0.15); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.16);
  }
};

window.PM={DENOMS:DENOMS,BY:BY,coinSVG:coinSVG,noteSVG:noteSVG,sfx:sfx,fmt:fmt,toast:toast};
})();
</script>
<script>
(function(){
'use strict';
var PM=window.PM;
var fmt=PM.fmt, toast=PM.toast, sfx=PM.sfx, DENOMS=PM.DENOMS, BY=PM.BY;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// ---------- constants ----------
var KEY='oliverEnvelopes.v1';
var COLORS=['#f59e42','#5c6bc0','#5aa9e6','#7bc67b','#b48ee8','#f2c94c','#4fc1b8','#e57373','#8d9be8','#c49a6c','#9ccc65','#78909c','#ffb74d','#4db6ac'];
var EMOJIS=['🔥','🎡','🛒','👕','💇','🅿️','🧒','🏊','🐾','🎒','🏠','✨','🍔','🎁','🚗','⚽','📚','🎮','🧾','🌱','✈️','🎂','🍿','🛠️','📱','💡','🎨','🦷','🐶','🐱'];
var DEFAULTS=[['Gas','🔥',40],['Outings','🎡',140],['Costco','🛒',130],['Clothing','👕',80],['Hair','💇',70],['Parking','🅿️',40],
  ['Oliver','🧒',90],['Pool','🏊',50],['Chloe Minnie','🐾',100],['School','🎒',150],['Council Rates','🏠',134],['Other','✨',400]];
var FIRST_START='2026-10-22';

// ---------- dates (local, YYYY-MM-DD) ----------
function p2(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function pd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d);}
function todayS(){return ymd(new Date());}
function dayDiff(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function dShort(s){return pd(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});}
function dNoDay(s){return pd(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'});}
function dLong(s){return pd(s).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});}
function tsDay(ts){return ymd(new Date(ts));}
function ago(s){var n=dayDiff(s,todayS());return n===0?'today':n===1?'yesterday':n+' days ago';}
function isDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(pd(s));}

// ---------- money text ----------
function toCents(str){
  str=String(str==null?'':str).replace(/[$,\s]/g,'');
  if(str==='') return 0;
  if(!/^\d*\.?\d{0,2}$/.test(str)) return NaN;
  var p=str.split('.'), d=p[0]?parseInt(p[0],10):0, c=p[1]?parseInt((p[1]+'0').slice(0,2),10):0;
  return d*100+c;
}
function plain(c){return (c/100).toFixed(2).replace(/\.00$/,'');}

// ---------- state ----------
var S=null, storageOK=true, view='cards';
function fresh(){
  var envs=[{id:'savings',name:'Main Savings',emoji:'🐷',color:'#17a06b',amount:0,keep:true,note:'',savings:true}];
  DEFAULTS.forEach(function(d,i){envs.push({id:'e'+(i+1),name:d[0],emoji:d[1],color:COLORS[i%COLORS.length],amount:d[2]*100,keep:false,note:''});});
  var base={}; envs.forEach(function(e){base[e.id]=e.amount;});
  return {v:1,envs:envs,fns:[{id:1,start:FIRST_START,base:base,moves:[],swept:0,sweptFrom:{},prevLeft:{}}],counts:[],pin:'',setup:false,nextId:DEFAULTS.length+1};
}
function valid(p){
  if(!p||p.v!==1||!Array.isArray(p.envs)||!Array.isArray(p.fns)||!Array.isArray(p.counts)||!p.fns.length) return false;
  if(!p.envs.length||p.envs[0].id!=='savings') return false;
  if(!p.envs.every(function(e){return e&&typeof e.id==='string'&&typeof e.name==='string'&&Number.isInteger(e.amount);})) return false;
  if(!p.fns.every(function(f){return f&&isDate(f.start)&&f.base&&Array.isArray(f.moves);})) return false;
  return p.counts.every(function(c){return c&&typeof c.ts==='number'&&c.vals&&typeof c.vals==='object';});
}
function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){var p=JSON.parse(s); if(valid(p)) S=p;}
    localStorage.setItem(KEY+'.t','1'); localStorage.removeItem(KEY+'.t');
  }catch(e){storageOK=false;}
  if(!S) S=fresh();
  var swap={'#ff7a9c':'#17a06b','#ec6f8f':'#5c6bc0','#f48fb1':'#78909c'};
  S.envs.forEach(function(e){if(swap[e.color]) e.color=swap[e.color];});
}
function saveLocal(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}
}
function save(){saveLocal(); if(sess){sync.dirty=true; lsSet(SYNCKEY,sync); schedulePush();}}
function touchEnvs(){S.envsM=Date.now();}
function tomb(k,id){S.deleted=S.deleted||{}; (S.deleted[k]=S.deleted[k]||[]).push(id);}

// ---------- model ----------
function env(id){for(var i=0;i<S.envs.length;i++) if(S.envs[i].id===id) return S.envs[i]; return null;}
function sav(){return S.envs[0];}
function activeEnvs(){return S.envs.filter(function(e){return !e.archived;});}
function cur(){return S.fns[S.fns.length-1];}
function fnById(id){for(var i=0;i<S.fns.length;i++) if(S.fns[i].id===id) return S.fns[i]; return null;}
function fnCounts(f){return S.counts.filter(function(c){return c.fid===f.id;});}
function openCount(){var c=S.counts[S.counts.length-1];return c&&c.fid===cur().id?c:null;}
function endOf(f){return addD(f.start,13);}
function dueDate(){return addD(cur().start,14);}
function isDue(){return todayS()>=dueDate();}
function nextStart(){
  var due=dueDate(), t=todayS();
  if(t<due) return due;
  return addD(due,Math.floor(dayDiff(due,t)/14)*14);
}
// Money in an envelope at a point in time, inside fortnight f: last counted value (or the start), adjusted by moves since.
function leftAt(f,eid,ts){
  var v=f.base[eid]||0, t0=-1, cs=fnCounts(f);
  for(var i=cs.length-1;i>=0;i--){var c=cs[i]; if(c.ts<=ts&&c.vals[eid]){v=c.vals[eid].amt;t0=c.ts;break;}}
  f.moves.forEach(function(m){if(m.ts>t0&&m.ts<=ts){if(m.to===eid)v+=m.amt;if(m.from===eid)v-=m.amt;}});
  return v;
}
function leftNow(eid){return leftAt(cur(),eid,Infinity);}
function netMoves(f,eid){var n=0;f.moves.forEach(function(m){if(m.to===eid)n+=m.amt;if(m.from===eid)n-=m.amt;});return n;}
function startPlus(f,eid){return (f.base[eid]||0)+netMoves(f,eid);}
function spentIn(f,eid){return startPlus(f,eid)-leftAt(f,eid,Infinity);}
function spentFn(f){var t=0;S.envs.forEach(function(e){if(!e.savings) t+=spentIn(f,e.id);});return t;}
function totalNow(){var t=0;activeEnvs().forEach(function(e){t+=leftNow(e.id);});return t;}
function everSwept(){var t=0;S.fns.forEach(function(f){t+=f.swept||0;});return t;}
function hasData(eid){
  if(S.fns.some(function(f){return f.base[eid];})) return true;
  return S.counts.some(function(c){return c.vals[eid];});
}
function countDone(c){return activeEnvs().every(function(e){return c.vals[e.id];});}
function countTotal(c){var t=0,n=0;for(var k in c.vals){t+=c.vals[k].amt;n++;}return {t:t,n:n};}

// ---------- side ----------
function renderSide(){
  var f=cur(), t=todayS(), day=dayDiff(f.start,t)+1, due=dueDate();
  $('eDates').textContent=dShort(f.start)+' → '+dShort(endOf(f));
  var dots='';
  for(var i=1;i<=14;i++) dots+='<i class="'+(i<day?'done':i===day?'today':'')+'"></i>';
  $('eDots').innerHTML=dots;
  var d=$('eDue');
  if(t<f.start){d.className='e-due';d.textContent='Starts '+dLong(f.start);}
  else if(t>=due){d.className='e-due now';d.textContent=t===due?'New fortnight is due today! 🎉':'New fortnight was due '+dShort(due)+'.';}
  else {var left=dayDiff(t,due);d.className='e-due';d.innerHTML='Day <b>'+day+'</b> of 14 &middot; new fortnight in <b>'+left+'</b> day'+(left===1?'':'s')+' ('+dShort(due)+')';}
  $('eTotal').textContent=fmt(totalNow());
  $('eSav').textContent=fmt(leftNow('savings'));
  $('eSpent').textContent=fmt(Math.max(0,spentFn(f)));
  var cs=fnCounts(f), lc=cs[cs.length-1];
  $('eLast').textContent=lc?'Last count '+dShort(tsDay(lc.ts))+' ('+ago(tsDay(lc.ts))+')':'No counts yet this fortnight';
  var oc=openCount(), cb=$('eCountBtn');
  cb.textContent=oc&&tsDay(oc.ts)===t&&!countDone(oc)?'Keep counting':'New count';
  $('eFnBtn').classList.toggle('due',isDue());
  $('eWarn').classList.toggle('show',!storageOK);
}

// ---------- cards ----------
function cardHTML(e){
  var f=cur(), L=leftNow(e.id);
  if(e.savings){
    var lastSweep=f.swept||0;
    return '<button class="e-card sav" data-env="savings" style="--c:'+e.color+'"><div class="e-stamp">'+e.emoji+'</div>'+
      '<div class="e-name">'+esc(e.name)+'</div><div class="e-left">'+fmt(L)+'</div>'+
      '<div class="e-savrow"><div>Leftovers swept in on '+dNoDay(f.start)+'<b>'+(S.fns.length>1?fmt(lastSweep):'–')+'</b></div>'+
      '<div>Swept in since we started<b>'+fmt(everSwept())+'</b></div>'+
      (e.amount?'<div>Added each fortnight<b>'+fmt(e.amount)+'</b></div>':'')+'</div>'+
      (e.note?'<div class="e-for" style="margin-top:8px">'+esc(e.note)+'</div>':'')+'</button>';
  }
  var st=startPlus(f,e.id), pct=st>0?Math.max(0,Math.min(1,L/st)):0, spent=st-L;
  var low=st>0&&pct<0.2;
  return '<button class="e-card'+(low?' low':'')+'" data-env="'+e.id+'" style="--c:'+e.color+'"><div class="e-stamp">'+e.emoji+'</div>'+
    '<div class="e-name">'+esc(e.name)+'</div><div class="e-left">'+fmt(L)+'</div>'+
    '<div class="e-of">left of '+fmt(st)+'</div><div class="e-bar"><i style="width:'+(pct*100).toFixed(1)+'%"></i></div>'+
    (e.note?'<div class="e-for">'+esc(e.note)+'</div>':'')+
    '<div class="e-foot"><span>'+(spent>0?'Spent '+fmt(spent):spent<0?'Found '+fmt(-spent)+' extra':'Nothing spent yet')+'</span>'+
    '<span class="e-pill'+(e.keep?' keep':'')+'">'+(e.keep?'Keeps leftovers':'Leftovers → 🐷')+'</span></div></button>';
}
function renderCards(){
  var h='<div class="e-grid">'+activeEnvs().map(cardHTML).join('')+'</div>';
  var v=$('eView'); v.className='e-view'; v.innerHTML=h;
  $('eHint').textContent='Which envelope should it come from? Tap one to see more.';
}

// ---------- counts table ----------
function renderCounts(){
  var envs=S.envs.filter(function(e){return !e.archived||hasData(e.id);});
  var oc=openCount(), cols=[];
  S.fns.slice().reverse().forEach(function(f){
    var g=fnCounts(f).slice().reverse().map(function(c){return {t:'c',f:f,c:c};});
    g.push({t:'s',f:f}); g[0].gs=true; g[0].span=g.length;
    cols=cols.concat(g);
  });
  function val(col,e){
    if(col.t==='s') return col.f.base.hasOwnProperty(e.id)?col.f.base[e.id]:null;
    return col.c.vals[e.id]?col.c.vals[e.id].amt:null;
  }
  function prevVal(i,e){ // the next older value in the same fortnight
    for(var j=i+1;j<cols.length&&cols[j].f===cols[i].f;j++){var v=val(cols[j],e); if(v!=null) return v;}
    return null;
  }
  var h='<table class="e-table"><thead><tr class="band"><th class="corner"></th>';
  cols.forEach(function(col){
    if(!col.gs) return;
    var isCur=col.f===cur();
    h+='<th colspan="'+col.span+'" class="gs'+(isCur?' cur':'')+'">'+(isCur?'This fortnight':dNoDay(col.f.start)+' – '+dNoDay(endOf(col.f)))+'</th>';
  });
  h+='<th class="fill"></th></tr><tr class="dates"><th class="corner">Envelope</th>';
  cols.forEach(function(col){
    var cls=col.gs?'gs':'';
    if(col.t==='s') h+='<th class="'+cls+'"><span class="stl">Start</span><span class="when">'+dShort(col.f.start)+'</span></th>';
    else {
      var act=col.c===oc, ds=tsDay(col.c.ts);
      h+='<th class="'+cls+(act?' col-active':'')+'">'+(act?'<span class="chip">'+dShort(ds)+'</span>':dShort(ds))+'<span class="when">'+(act?'counting now':ago(ds))+'</span></th>';
    }
  });
  h+='<th class="fill"></th></tr></thead><tbody>';
  envs.forEach(function(e){
    h+='<tr class="'+(e.savings?'savr':'')+(e.archived?' arch':'')+'"><th class="env"><div class="e-rowh" style="--c:'+e.color+'"><span class="e-dot">'+e.emoji+'</span><span><b>'+esc(e.name)+'</b><small>'+
      (e.archived?'removed':e.savings?(e.amount?fmt(e.amount)+' added each fortnight':'Leftovers go here'):fmt(e.amount)+' a fortnight'+(e.keep?' · keeps':''))+'</small></span></div></th>';
    cols.forEach(function(col,i){
      var v=val(col,e), cls='ec'+(col.gs?' gs':'')+(col.t==='s'?' st':'');
      var act=col.t==='c'&&col.c===oc&&!e.archived;
      if(act) cls+=' col-active tap';
      var inner;
      if(v==null) inner=act?'<span class="tapme">Tap to count</span>':'<div class="z">–</div>';
      else {
        inner='<div class="a">'+fmt(v)+'</div>';
        if(col.t==='c'){var pv=prevVal(i,e); if(pv!=null){var df=v-pv; inner+='<div class="d">'+(df<0?'<span class="chg down">▼ '+fmt(-df)+'</span>':df>0?'<span class="chg up">▲ '+fmt(df)+'</span>':'<span class="chg same">same</span>')+'</div>';}}
        else if(col.f.prevLeft&&col.f.prevLeft[e.id]&&!e.savings&&col.f.sweptFrom&&!col.f.sweptFrom[e.id]) inner+='<div class="d" style="color:#17703d">incl. '+fmt(col.f.prevLeft[e.id])+' kept</div>';
        else if(e.savings&&col.f.swept) inner+='<div class="d" style="color:var(--pinkdark)">+'+fmt(col.f.swept)+' swept</div>';
      }
      h+='<td class="'+cls+'"'+(act?' data-env="'+e.id+'"':'')+'>'+inner+'</td>';
    });
    h+='<td class="fill"></td></tr>';
  });
  h+='<tr class="total"><th>Total</th>';
  cols.forEach(function(col,i){
    var t=0,n=0; envs.forEach(function(e){var v=val(col,e); if(v!=null){t+=v;n++;}});

var M=null; // current modal controller {click(el,a), input(el)}
function openM(html,ctl,cls){var m=$('eMod');m.className='modal'+(cls?' '+cls:'');m.innerHTML=html;M=ctl||{};$('eOv').classList.add('show');m.scrollTop=0;}
function closeM(){$('eOv').classList.remove('show');$('eMod').innerHTML='';M=null;}
$('eOv').addEventListener('click',function(e){if(e.target===this&&!(M&&M.sticky)) closeM();});
$('eMod').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||!M) return;
  var a=b.getAttribute('data-a'); if(a==='close'){closeM();return;}
  if(M.click) M.click(b,a);
});
$('eMod').addEventListener('input',function(e){if(M&&M.input) M.input(e.target);});
function head(e,sub){
  return '<div class="e-mhead" style="--c:'+e.color+'"><span class="e-dot">'+e.emoji+'</span><div><h2>'+esc(e.name)+'</h2>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div><button class="x" data-a="close" aria-label="Close">✕</button></div>';
}
function keypad(){return '<div class="keys">'+['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(function(k){return '<button data-a="key" data-k="'+k+'">'+k+'</button>';}).join('')+'</div>';}
function applyKey(st,k){ // st.str, st.fresh
  if(st.fresh){st.str='';st.fresh=false;}
  var s=st.str;
  if(k==='⌫') s=s.slice(0,-1);
  else if(k==='.'){if(s.indexOf('.')<0) s=(s||'0')+'.';}
  else {
    var dot=s.indexOf('.');
    if(dot>=0&&s.length-dot>2) return;
    if(dot<0&&s.replace(/^0+/,'').length>=6) return;
    s=(s==='0'?'':s)+k;
  }
  st.str=s;
}
function dispTxt(st){if(!st.str) return '$0'; var p=st.str.split('.'); return '$'+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(p.length>1?'.'+p[1]:'');}

// ---------- count pad ----------
function startCount(){
  var c={id:Date.now(),ts:Date.now(),fid:cur().id,vals:{}};
  S.counts.push(c); save(); view='counts'; render();
  openPad(activeEnvs()[0].id);
}
function askCount(){
  var oc=openCount(), t=todayS();
  if(oc&&tsDay(oc.ts)===t&&!countDone(oc)){view='counts';render();openPad(nextUncounted(null)||activeEnvs()[0].id);return;}
  openM('<h2>Start a new count?</h2><p>A new column for <b>'+dShort(t)+'</b> will appear. Count each envelope one at a time. You can type the total or tap the coins and notes.</p>'+
    (oc&&tsDay(oc.ts)===t?'<div class="callout">You already counted today. Starting another count adds a second column for today.</div>':'')+
    '<div class="mrow"><button class="mbtn" data-a="close">Cancel</button><button class="mbtn go" data-a="go">Start counting</button></div>',
    {click:function(b,a){if(a==='go'){closeM();startCount();}}});
}
function nextUncounted(after){
  var c=openCount(); if(!c) return null;
  var list=activeEnvs(), i=after?list.findIndex(function(e){return e.id===after;}):-1;
  for(var j=1;j<=list.length;j++){var e=list[(i+j)%list.length]; if(!c.vals[e.id]&&e.id!==after) return e.id;}
  return null;
}
function openPad(eid){
  var c=openCount(); if(!c){toast('Tap New count first!');return;}
  var e=env(eid), ex=c.vals[eid], f=cur();
  var prevTs=c.ts-1, before=leftAt(f,eid,prevTs);
  var st={mode:ex&&ex.items?'tap':'type',str:ex?plain(ex.amt):'',fresh:!!ex,items:ex&&ex.items?JSON.parse(JSON.stringify(ex.items)):{},undo:[],take:false};
  var list=activeEnvs(), idx=list.findIndex(function(x){return x.id===eid;})+1;
  function tapTotal(){var t=0;DENOMS.forEach(function(d){t+=(st.items[d.k]||0)*d.c;});return t;}
  function amount(){return st.mode==='tap'?tapTotal():toCents(st.str);}
  function draw(){
    var nx=nextUncounted(eid), nxe=nx?env(nx):null;
    var h=head(e,'Envelope '+idx+' of '+list.length+' &middot; counting '+dShort(tsDay(c.ts)))+
      '<div class="e-info"><div>Should have about<b>'+fmt(before)+'</b></div><div>Started the fortnight with<b>'+fmt(startPlus(f,eid))+'</b></div>'+(e.note?'<div>For<b style="font-size:15px">'+esc(e.note)+'</b></div>':'')+'</div>'+
      '<div class="seg"><button data-a="mode" data-m="type" class="'+(st.mode==='type'?'on':'')+'">⌨️ Type the total</button><button data-a="mode" data-m="tap" class="'+(st.mode==='tap'?'on':'')+'">🪙 Count coins &amp; notes</button></div>';
    if(st.mode==='type') h+='<div class="pad-disp'+(st.fresh?' fresh':'')+'" id="pDisp">'+dispTxt(st)+'</div>'+keypad();
    else {
      h+='<div class="pad-disp" id="pDisp">'+fmt(tapTotal())+'</div><div class="coins'+(st.take?' minus':'')+'">';
      DENOMS.forEach(function(d){var n=st.items[d.k]||0; h+='<button data-a="coin" data-k="'+d.k+'" aria-label="'+d.k+'">'+(d.type==='coin'?PM.coinSVG(d,1.9,false):PM.noteSVG(d,0.6,false))+(n?'<span class="cnt">'+n+'</span>':'')+'</button>';});
      h+='</div><div class="tbar"><button class="mbtn" data-a="cundo">Oops (undo)</button><button class="mbtn'+(st.take?' on':'')+'" data-a="take">'+(st.take?'Taking away…':'Take away')+'</button><button class="mbtn" data-a="cclear">Start again</button></div>';
    }
    h+='<div class="mrow sp"><button class="mbtn" data-a="zero">It\'s empty ($0)</button><span style="display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="mbtn" data-a="save">Save</button>'+(nxe?'<button class="mbtn go" data-a="next">Save &amp; next: '+esc(nxe.name)+' →</button>':'<button class="mbtn go" data-a="save">Save &amp; finish</button>')+'</span></div>';
    openM(h,ctl,'wide');
  }
  function commit(amt){
    c.vals[eid]=st.mode==='tap'&&amt===tapTotal()&&amt>0?{amt:amt,items:st.items}:{amt:amt};
    save(); render();
  }
  function finishOrNext(goNext){
    var nx=nextUncounted(eid);
    if(goNext&&nx){openPad(nx);return;}
    closeM();
    if(countDone(c)){sfx.oink();toast('Count finished! Total '+fmt(countTotal(c).t));}
    else if(nx) toast('Saved. '+(activeEnvs().length-Object.keys(c.vals).length)+' still to count');
  }
  var ctl={sticky:true,click:function(b,a){
    if(a==='mode'){var m=b.getAttribute('data-m'); if(m!==st.mode){if(m==='type'){st.str=tapTotal()?plain(tapTotal()):st.str;st.fresh=false;} st.mode=m; draw();}}
    else if(a==='key'){applyKey(st,b.getAttribute('data-k')); var d=$('pDisp'); d.textContent=dispTxt(st); d.classList.remove('fresh');}
    else if(a==='coin'){
      var k=b.getAttribute('data-k'), dd=BY[k], n=st.items[k]||0;
      if(st.take){if(!n){toast('There are no '+k+' to take away');return;} st.items[k]=n-1; st.undo.push({k:k,d:-1}); sfx.plop();}
      else {st.items[k]=n+1; st.undo.push({k:k,d:1}); if(dd.type==='coin') sfx.clink(dd.metal==='silver'); else sfx.swish();}
      if(!st.items[k]) delete st.items[k];
      draw();
    }
    else if(a==='cundo'){var u=st.undo.pop(); if(!u){toast('Nothing to undo');return;} var nn=(st.items[u.k]||0)-u.d; if(nn>0) st.items[u.k]=nn; else delete st.items[u.k]; draw();}
    else if(a==='take'){st.take=!st.take; draw();}
    else if(a==='cclear'){st.items={};st.undo=[];draw();}
    else if(a==='zero'){st.mode='type';st.str='0';commit(0);finishOrNext(true);}
    else if(a==='save'||a==='next'){
      var amt=amount(); if(isNaN(amt)){toast('That amount doesn\'t look right');return;}
      commit(amt); finishOrNext(a==='next');
    }
  }};
  draw();
}

// ---------- new fortnight ----------
function plan(){
  var rows=[], swept=0, s=sav();
  activeEnvs().forEach(function(e){
    if(e.savings) return;
    var L=leftNow(e.id), sw=e.keep?0:L;
    swept+=sw; rows.push({e:e,left:L,sweep:sw,add:e.amount,start:(e.keep?L:0)+e.amount});
  });
  var sl=leftNow('savings');
  return {rows:rows,swept:swept,savLeft:sl,savAdd:s.amount,savStart:sl+swept+s.amount,start:nextStart()};
}
function askFortnight(){
  var f=cur(), cs=fnCounts(f), lc=cs[cs.length-1], t=todayS(), ns=nextStart();
  var h='<h2>Start a new fortnight?</h2>';
  if(t<dueDate()) h+='<div class="callout">The new fortnight isn\'t due until <b>'+dLong(dueDate())+'</b>. You can still start it early.</div>';
  if(!lc) h+='<p>There\'s been <b>no count</b> this fortnight, so the leftovers will be what each envelope started with. Best to count first.</p>';
  else if(tsDay(lc.ts)!==t) h+='<p>The last count was <b>'+dShort(tsDay(lc.ts))+'</b> ('+ago(tsDay(lc.ts))+'). If money has been spent since, count again first so the leftovers are right.</p>';
  else if(!countDone(lc)) h+='<p>Today\'s count isn\'t finished yet. Envelopes you haven\'t counted use their last known amount.</p>';
  else h+='<p>Today\'s count is done. Next we work out what\'s left in each envelope, sweep the leftovers into Main Savings, and refill every envelope.</p>';
  var fresh=lc&&tsDay(lc.ts)===t&&countDone(lc);
  h+='<div class="mrow">'+(fresh?'':'<button class="mbtn" data-a="count">Count first</button>')+'<button class="mbtn'+(fresh?' go':'')+'" data-a="go">'+(fresh?'Next →':'Use what we have →')+'</button></div>';
  openM(h,{click:function(b,a){
    if(a==='count'){closeM();askCount();}
    else if(a==='go') showPlan();
  }});
}
function showPlan(){
  function draw(){
    var p=plan();
    var h='<div class="e-mhead"><div><h2>New fortnight: '+dShort(p.start)+'</h2><div class="sub">Tap a rule to change it. Then do the real envelopes to match.</div></div><button class="x" data-a="close">✕</button></div>'+
      '<table class="etbl"><thead><tr><th class="l">Envelope</th><th>Left over</th><th class="l">Leftovers</th><th>To 🐷</th><th>New cash</th><th>Starts with</th></tr></thead><tbody>';
    p.rows.forEach(function(r){
      h+='<tr><td class="l"><span class="nm" style="--c:'+r.e.color+'"><span class="e-dot">'+r.e.emoji+'</span>'+esc(r.e.name)+'</span></td><td>'+fmt(r.left)+'</td>'+
        '<td class="l"><button class="tgl'+(r.e.keep?' on':'')+'" data-a="rule" data-id="'+r.e.id+'">'+(r.e.keep?'Keep':'→ Savings')+'</button></td>'+
        '<td class="arrow">'+(r.sweep?fmt(r.sweep):'–')+'</td><td>+'+fmt(r.add)+'</td><td><b>'+fmt(r.start)+'</b></td></tr>';
    });
    h+='<tr class="savt"><td class="l"><span class="nm"><span class="e-dot" style="background:'+sav().color+'">🐷</span>Main Savings</span></td><td>'+fmt(p.savLeft)+'</td><td></td><td class="arrow">+'+fmt(p.swept)+'</td><td>'+(p.savAdd?'+'+fmt(p.savAdd):'–')+'</td><td>'+fmt(p.savStart)+'</td></tr>';
    var cash=p.rows.reduce(function(t,r){return t+r.add;},0)+p.savAdd;
    h+='</tbody><tfoot><tr><td class="l">New cash needed</td><td></td><td></td><td></td><td>'+fmt(cash)+'</td><td></td></tr></tfoot></table>'+
      '<div class="callout"><b>Do it for real:</b> 1. Take the leftovers out of the “→ Savings” envelopes and put <b>'+fmt(p.swept)+'</b> into Main Savings. 2. Put the new cash into each envelope.</div>'+
      '<div class="mrow"><button class="mbtn" data-a="close">Not yet</button><button class="mbtn go" data-a="do">Done – start the fortnight</button></div>';
    openM(h,ctl,'xwide');
  }
  var ctl={sticky:true,click:function(b,a){
    if(a==='rule'){var e=env(b.getAttribute('data-id')); e.keep=!e.keep; touchEnvs(); save(); draw();}
    else if(a==='do') doFortnight();
  }};
  draw();
}
function doFortnight(){
  var p=plan(), base={}, sweptFrom={}, prevLeft={};
  p.rows.forEach(function(r){base[r.e.id]=r.start; prevLeft[r.e.id]=r.left; if(r.sweep) sweptFrom[r.e.id]=r.sweep;});
  base.savings=p.savStart; prevLeft.savings=p.savLeft;
  var id=Date.now();
  S.fns.push({id:id,m:id,start:p.start,base:base,moves:[],swept:p.swept,sweptFrom:sweptFrom,prevLeft:prevLeft});
  save(); view='cards'; render();
  var best=p.rows.filter(function(r){return r.sweep>0;}).sort(function(a,b){return b.sweep-a.sweep;}).slice(0,3);
  openM('<div class="party"><div class="em">🎉🐷</div><h2 style="margin-top:8px">This fortnight we saved</h2><div class="bigsave">'+fmt(p.swept)+'</div>'+
    '<p>Main Savings now has <b>'+fmt(p.savStart)+'</b>.'+(best.length?'<br>Most left over: '+best.map(function(r){return r.e.emoji+' '+esc(r.e.name)+' '+fmt(r.sweep);}).join(', ')+'.':'')+'</p>'+
    '<p class="note">New fortnight: '+dShort(p.start)+' – '+dShort(addD(p.start,13))+'</p></div><div class="mrow"><button class="mbtn go" data-a="close">Yay!</button></div>');
  sfx.oink(); confetti();
}
function confetti(){
  var cols=['#17a06b','#ffc93c','#5aa9e6','#7bc67b','#b48ee8'];
  for(var i=0;i<60;i++){
    var c=document.createElement('div'); c.className='confetti'; c.style.left=(Math.random()*100)+'vw'; c.style.background=cols[i%cols.length];
    document.body.appendChild(c);
    var dur=1800+Math.random()*1500, x=(Math.random()*160-80);
    if(c.animate) c.animate([{transform:'translate(0,0) rotate(0)'},{transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate('+(Math.random()*720)+'deg)'}],{duration:dur,delay:Math.random()*400,easing:'cubic-bezier(.3,.6,.6,1)',fill:'forwards'});
    (function(el){setTimeout(function(){el.remove();},dur+500);})(c);
  }
}

// ---------- grown-ups ----------
function grownUps(){withPin(gu);}
function gu(){
  var f=cur(), act=activeEnvs(), arch=S.envs.filter(function(e){return e.archived;});
  var h='<div class="e-mhead"><div><h2>Grown-ups</h2><div class="sub">Envelopes, the fortnight, counts and backup</div></div><button class="x" data-a="close">✕</button></div>';
  h+='<div class="sec">Envelopes</div><ul class="glist">';
  act.forEach(function(e,i){
    h+='<li><span class="nm" style="--c:'+e.color+'"><span class="e-dot">'+e.emoji+'</span>'+esc(e.name)+'</span>'+
      '<span class="amt">'+(e.savings?(e.amount?fmt(e.amount)+'/fn':''):fmt(e.amount)+'/fn')+'</span>'+
      (e.savings?'':'<span class="e-pill'+(e.keep?' keep':'')+'">'+(e.keep?'Keeps':'→ 🐷')+'</span>')+
      (e.savings?'':'<button class="mbtn arr" data-a="up" data-id="'+e.id+'"'+(i<=1?' disabled':'')+'>▲</button><button class="mbtn arr" data-a="down" data-id="'+e.id+'"'+(i===act.length-1?' disabled':'')+'>▼</button>')+
      '<button class="mbtn" data-a="edit" data-id="'+e.id+'">Edit</button></li>';
  });
  var tot=act.reduce(function(t,e){return t+e.amount;},0);
  h+='</ul><div class="mrow" style="justify-content:space-between;align-items:center"><span class="note">New cash each fortnight: <b>'+fmt(tot)+'</b></span><button class="mbtn go" data-a="add">+ Add envelope</button></div>';
  if(arch.length){
    h+='<div class="sec">Removed envelopes</div><p class="note">Kept so old counts still make sense.</p><ul class="glist">'+arch.map(function(e){
      return '<li><span class="nm" style="--c:'+e.color+'"><span class="e-dot">'+e.emoji+'</span>'+esc(e.name)+'</span><button class="mbtn" data-a="restoreEnv" data-id="'+e.id+'">Bring back</button></li>';}).join('')+'</ul>';
  }
  h+='<div class="sec">This fortnight</div><p class="note">Started '+dLong(f.start)+'. Next one due '+dLong(dueDate())+'.</p>'+
    '<div class="mrow" style="justify-content:flex-start"><button class="mbtn" data-a="fixStart">Fix starting amounts or date</button>'+
    (S.fns.length>1&&!fnCounts(f).length&&!f.moves.length?'<button class="mbtn" data-a="undoFn">Undo the last new fortnight</button>':'')+'</div>';
  var cs=fnCounts(f).slice().reverse();
  h+='<div class="sec">Counts this fortnight</div>'+(cs.length?'<ul class="glist">'+cs.map(function(c){var ct=countTotal(c);
      return '<li><span class="nm" style="font-weight:500">'+dShort(tsDay(c.ts))+' &middot; <b>'+fmt(ct.t)+'</b> <span class="note">('+ct.n+' envelopes)</span></span><button class="mbtn" data-a="delCount" data-id="'+c.id+'">Delete</button></li>';}).join('')+'</ul>':'<p class="note">No counts yet.</p>');
  if(f.moves.length) h+='<div class="sec">Money moved this fortnight</div><ul class="glist">'+f.moves.slice().reverse().map(function(m){
      return '<li><span class="nm" style="font-weight:500">'+dShort(tsDay(m.ts))+' &middot; '+fmt(m.amt)+' '+esc(env(m.from).name)+' → '+esc(env(m.to).name)+'</span><button class="mbtn" data-a="delMove" data-id="'+m.id+'">Delete</button></li>';}).join('')+'</ul>';
  h+='<div class="sec">Family group</div>'+(sess?'<p class="note">This device is connected to <b>'+esc(sess.name)+'</b>. Changes save online and show on the other devices in the group.</p>'+
    '<div class="mrow" style="justify-content:flex-start"><button class="mbtn" data-a="syncNow">Sync now</button><button class="mbtn" data-a="disc">Disconnect this device</button></div>':'<p class="note">Not connected.</p>');
  h+='<div class="sec">Grown-ups PIN</div><p class="note">'+(S.pin?'A PIN is set. It is needed to get in here.':'No PIN yet. Set one so only grown-ups can change envelopes.')+'</p>'+
    '<div class="mrow" style="justify-content:flex-start;align-items:center"><input class="money-in" id="gPin" inputmode="numeric" maxlength="4" placeholder="4 digits" style="text-align:center">'+
    '<button class="mbtn" data-a="setPin">'+(S.pin?'Change PIN':'Set PIN')+'</button>'+(S.pin?'<button class="mbtn" data-a="clearPin">Remove PIN</button>':'')+'</div>';
  h+='<div class="sec">Backup</div><p class="note">Copies all envelope data as text. Paste it into Notes to keep it safe, or to move it to another device.</p>'+
    '<div class="mrow" style="justify-content:flex-start"><button class="mbtn" data-a="copy">Copy backup</button></div>'+
    '<div class="sec">Restore</div><p class="note">Paste a backup here. This replaces all envelope data on this device.</p><textarea id="gRestore" placeholder="Paste backup text"></textarea>'+
    '<div class="mrow" style="margin-top:10px"><button class="mbtn" data-a="restore">Restore</button><button class="mbtn go" data-a="close">Done</button></div>'+
    '<p class="note" style="margin-top:12px">Saving on this device: '+(storageOK?'working':'<b style="color:#d23d3d">not working</b>')+'</p>';
  openM(h,{click:function(b,a){
    var id=b.getAttribute('data-id');
    if(a==='edit') openEdit(id,gu);
    else if(a==='add') openEdit(null,gu);
    else if(a==='up'||a==='down'){
      var i=S.envs.findIndex(function(e){return e.id===id;}), j=i, step=a==='up'?-1:1;
      do{j+=step;}while(j>0&&j<S.envs.length&&S.envs[j].archived);
      if(j<1||j>=S.envs.length) return;
      var t=S.envs[i];S.envs[i]=S.envs[j];S.envs[j]=t; touchEnvs(); save(); render(); gu();
    }
    else if(a==='restoreEnv'){env(id).archived=false; touchEnvs(); save(); render(); gu(); toast('Envelope is back');}
    else if(a==='fixStart') openFixStart();
    else if(a==='undoFn'){
      if(!b.getAttribute('data-sure')){b.setAttribute('data-sure','1');b.textContent='Tap again to undo it';b.classList.add('danger');return;}
      tomb('fns',S.fns.pop().id); save(); render(); gu(); toast('Back to the fortnight from '+dShort(cur().start));
    }
    else if(a==='delCount'||a==='delMove'){
      if(!b.getAttribute('data-sure')){b.setAttribute('data-sure','1');b.textContent='Tap again to delete';b.classList.add('danger');return;}
      var n=Number(id);
      if(a==='delCount'){S.counts=S.counts.filter(function(c){return c.id!==n;}); tomb('counts',n);}
      else {cur().moves=cur().moves.filter(function(m){return m.id!==n;}); tomb('moves',n);}
      save(); render(); gu(); toast('Deleted');
    }
    else if(a==='syncNow'){closeM(); pull(); toast('Syncing…');}
    else if(a==='disc'){
      if(!b.getAttribute('data-sure')){b.setAttribute('data-sure','1');b.textContent='Tap again: removes the envelopes from this device only';b.classList.add('danger');return;}
      closeM(); disconnect(false);
    }
    else if(a==='setPin'){var v=$('gPin').value.trim(); if(!/^\d{4}$/.test(v)){toast('The PIN needs 4 digits');return;} S.pin=v; S.pinM=Date.now(); save(); gu(); toast('PIN set');}
    else if(a==='clearPin'){S.pin=''; S.pinM=Date.now(); save(); gu(); toast('PIN removed');}
    else if(a==='copy'){
      var txt=JSON.stringify(S);
      var fb=function(){var tb=$('gRestore');tb.value=txt;tb.focus();tb.select();toast('Select all and copy the text in the box');};
      try{navigator.clipboard.writeText(txt).then(function(){toast('Backup copied');},fb);}catch(err){fb();}
    }
    else if(a==='restore'){
      var raw=$('gRestore').value.trim(), p;
      try{p=JSON.parse(raw);}catch(err){toast('That backup text is not valid');return;}
      if(!valid(p)){toast('That backup text is not valid');return;}
      if(!b.getAttribute('data-sure')){b.setAttribute('data-sure','1');b.textContent='Tap again to replace everything';b.classList.add('danger');return;}
      S=p; saveLocal(); render(); closeM(); toast('Envelopes restored'); if(sess){sync.dirty=true; pushNow(true);}
    }
  }},'wide');
}

function openEdit(id,back){
  var isNew=!id, e=isNew?{id:null,name:'',emoji:EMOJIS[12],color:COLORS[S.envs.length%COLORS.length],amount:0,keep:false,note:''}:env(id);
  var st={name:e.name,emoji:e.emoji,color:e.color,amount:plain(e.amount),keep:e.keep,note:e.note||'',now:'0'};
  function draw(){
    var h='<div class="e-mhead" style="--c:'+st.color+'"><span class="e-dot">'+st.emoji+'</span><div><h2>'+(isNew?'New envelope':'Edit '+esc(e.name))+'</h2></div><button class="x" data-a="cancel">✕</button></div>'+
      '<label class="fld"><span>Name</span><input id="fName" type="text" maxlength="24" value="'+esc(st.name)+'"'+(e.savings?' disabled':'')+'></label>'+
      '<div class="fld"><span>Picture</span><div class="emo">'+(e.savings?['🐷','🏦','💰','⭐'] :EMOJIS).map(function(m){return '<button data-a="emo" data-v="'+m+'" class="'+(m===st.emoji?'on':'')+'">'+m+'</button>';}).join('')+'</div></div>'+
      '<div class="fld"><span>Colour</span><div class="sw">'+COLORS.concat(e.savings?['#17a06b']:[]).map(function(c){return '<button data-a="col" data-v="'+c+'" class="'+(c===st.color?'on':'')+'" style="background:'+c+'"></button>';}).join('')+'</div></div>'+
      '<label class="fld"><span>'+(e.savings?'Extra added each fortnight (on top of leftovers)':'Cash put in each fortnight')+'</span>$ <input class="money-in" id="fAmt" inputmode="decimal" value="'+esc(st.amount)+'"></label>'+
      (e.savings?'':'<div class="fld"><span>At the new fortnight</span><button class="tgl'+(st.keep?' on':'')+'" data-a="keep">'+(st.keep?'Keeps its leftovers (they build up)':'Leftovers go to Main Savings')+'</button></div>')+
      '<label class="fld"><span>What it\'s for (helps Oliver choose)</span><input id="fNote" type="text" maxlength="80" value="'+esc(st.note)+'" placeholder="e.g. movies, day trips, ice-creams"></label>'+
      (isNew?'<label class="fld"><span>Cash going in it right now</span>$ <input class="money-in" id="fNow" inputmode="decimal" value="'+esc(st.now)+'"></label>':'')+
      '<div class="mrow sp">'+(isNew||e.savings?'<span></span>':'<button class="mbtn danger" data-a="remove">Remove envelope</button>')+
      '<span style="display:flex;gap:10px"><button class="mbtn" data-a="cancel">Cancel</button><button class="mbtn go" data-a="save">Save</button></span></div>';
    openM(h,ctl,'wide');
  }
  function grab(){st.name=$('fName').value;st.amount=$('fAmt').value;st.note=$('fNote').value;if($('fNow')) st.now=$('fNow').value;}
  var ctl={sticky:true,click:function(b,a){
    if(a==='cancel'){back?back():closeM();}
    else if(a==='emo'){grab();st.emoji=b.getAttribute('data-v');draw();}
    else if(a==='col'){grab();st.color=b.getAttribute('data-v');draw();}
    else if(a==='keep'){grab();st.keep=!st.keep;draw();}
    else if(a==='remove'){openRemove(e.id,back);}
    else if(a==='save'){
      grab();
      var nm=st.name.trim(), amt=toCents(st.amount), now=isNew?toCents(st.now):0;
      if(!nm){toast('Give it a name');return;}
      if(isNaN(amt)||isNaN(now)){toast('Check the amounts');return;}
      if(S.envs.some(function(x){return x!==e&&!x.archived&&x.name.toLowerCase()===nm.toLowerCase();})){toast('There\'s already an envelope called '+nm);return;}
      if(isNew){
        e={id:'e'+Date.now().toString(36),name:nm,emoji:st.emoji,color:st.color,amount:amt,keep:st.keep,note:st.note.trim()};
        S.envs.push(e); cur().base[e.id]=now; cur().m=Date.now();
      } else {e.name=nm;e.emoji=st.emoji;e.color=st.color;e.amount=amt;e.keep=st.keep;e.note=st.note.trim();}
      touchEnvs(); save(); render(); toast(isNew?'Added '+nm:'Saved'); back?back():closeM();
    }
  }};
  draw();
}
function openRemove(id,back){
  var e=env(id), L=leftNow(id), st={to:'savings'};
  function draw(){
    var h=head(e,'Remove this envelope')+(L>0?'<p>It has <b>'+fmt(L)+'</b> in it. Where should that money go?</p><div class="chips">'+activeEnvs().filter(function(x){return x.id!==id;}).map(function(x){
        return '<button data-a="to" data-id="'+x.id+'" class="'+(st.to===x.id?'on':'')+'">'+x.emoji+' '+esc(x.name)+'</button>';}).join('')+'</div>':'<p>It\'s empty, so no money needs to move.</p>')+
      '<p class="note">Its old counts stay in the history. You can bring it back later from Grown-ups.</p>'+
      '<div class="mrow"><button class="mbtn" data-a="cancel">Cancel</button><button class="mbtn danger" data-a="do">Remove '+esc(e.name)+'</button></div>';
    openM(h,ctl);
  }
  var ctl={click:function(b,a){
    if(a==='to'){st.to=b.getAttribute('data-id');draw();}
    else if(a==='cancel'){openEdit(id,back);}
    else if(a==='do'){
      if(L>0) cur().moves.push({id:Date.now(),ts:Date.now(),from:id,to:st.to,amt:L,why:'envelope removed'});
      e.archived=true; touchEnvs(); save(); render(); toast(e.name+' removed'+(L>0?', '+fmt(L)+' moved to '+env(st.to).name:'')); back?back():closeM();
    }
  }};
  draw();
}
function openFixStart(){
  var f=cur();
  var h='<div class="e-mhead"><div><h2>This fortnight\'s start</h2><div class="sub">What was in each envelope when this fortnight began</div></div><button class="x" data-a="back">✕</button></div>'+
    '<label class="fld"><span>Fortnight started on</span><input id="fsDate" type="date" value="'+f.start+'"></label>'+
    '<table class="etbl"><tbody>'+activeEnvs().map(function(e){
      return '<tr><td class="l"><span class="nm" style="--c:'+e.color+'"><span class="e-dot">'+e.emoji+'</span>'+esc(e.name)+'</span></td><td>$ <input class="money-in" data-id="'+e.id+'" inputmode="decimal" value="'+plain(f.base[e.id]||0)+'"></td></tr>';}).join('')+
    '</tbody></table><div class="mrow"><button class="mbtn" data-a="back">Cancel</button><button class="mbtn go" data-a="save">Save</button></div>';
  openM(h,{sticky:true,click:function(b,a){
    if(a==='back') gu();
    else if(a==='save'){
      var d=$('fsDate').value, prev=S.fns[S.fns.length-2];
      if(!isDate(d)){toast('Pick a date');return;}
      if(prev&&d<=prev.start){toast('It must be after the previous fortnight began');return;}
      var nb={}, bad=false;
      Array.prototype.forEach.call(document.querySelectorAll('#eMod .money-in'),function(inp){var c=toCents(inp.value); inp.classList.toggle('bad',isNaN(c)); if(isNaN(c)) bad=true; else nb[inp.getAttribute('data-id')]=c;});
      if(bad){toast('Check the red amounts');return;}
      for(var k in nb) f.base[k]=nb[k];
      f.start=d; f.m=Date.now(); save(); render(); gu(); toast('Saved');
    }
  }},'wide');
}

// ---------- first-run setup ----------
function setup(){
  var f=cur();
  var h='<div class="e-mhead"><div><h2>Set up the envelopes</h2><div class="sub">Grown-up job, about a minute</div></div></div>'+
    '<div class="callout">These come from your cash envelope list, without Groceries. <b>Council Rates $134</b> is the Council line from the budget sheet, not the cash list, so check it. Everything can be changed later in Grown-ups.</div>'+
    '<label class="fld"><span>This fortnight started on</span><input id="suDate" type="date" value="'+f.start+'"></label>'+
    '<table class="etbl"><thead><tr><th class="l">Envelope</th><th>Each fortnight</th><th>In it at the start</th><th class="l">Leftovers</th></tr></thead><tbody>'+
    activeEnvs().map(function(e){
      return '<tr><td class="l"><span class="nm" style="--c:'+e.color+'"><span class="e-dot">'+e.emoji+'</span>'+esc(e.name)+'</span></td>'+
        '<td>$ <input class="money-in" data-k="amt" data-id="'+e.id+'" inputmode="decimal" value="'+plain(e.amount)+'"></td>'+
        '<td>$ <input class="money-in" data-k="base" data-id="'+e.id+'" inputmode="decimal" value="'+plain(f.base[e.id]||0)+'"></td>'+
        '<td class="l">'+(e.savings?'<span class="note">gets the leftovers</span>':'<button class="tgl'+(e.keep?' on':'')+'" data-a="keep" data-id="'+e.id+'">'+(e.keep?'Keep':'→ Savings')+'</button>')+'</td></tr>';
    }).join('')+'</tbody></table>'+
    '<p class="note">“In it at the start” is what each envelope had on the first day of this fortnight. It\'s how the app works out what\'s been spent. If you\'re not sure, leave it and your first count will show the real amounts.</p>'+
    '<div class="mrow"><button class="mbtn go" data-a="save">Save &amp; start</button></div>';
  openM(h,{sticky:true,click:function(b,a){
    if(a==='keep'){var e=env(b.getAttribute('data-id'));e.keep=!e.keep;touchEnvs();b.classList.toggle('on',e.keep);b.textContent=e.keep?'Keep':'→ Savings';}
    else if(a==='save'){
      var d=$('suDate').value; if(!isDate(d)){toast('Pick the start date');return;}
      var bad=false, vals=[];
      Array.prototype.forEach.call(document.querySelectorAll('#eMod .money-in'),function(inp){var c=toCents(inp.value);inp.classList.toggle('bad',isNaN(c));if(isNaN(c)) bad=true; vals.push([inp,c]);});
      if(bad){toast('Check the red amounts');return;}
      vals.forEach(function(v){var e=env(v[0].getAttribute('data-id')); if(v[0].getAttribute('data-k')==='amt') e.amount=v[1]; else f.base[e.id]=v[1];});
      f.start=d; f.m=Date.now(); touchEnvs(); S.setup=true; save(); closeM(); render(); toast('All set! Do a count to see the real amounts.');
    }
  }},'xwide');
}

// ---------- print ----------
function envIcon(){
  return '<svg viewBox="0 0 78 58" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="8" width="72" height="46" rx="6" fill="#fff4e6" stroke="#0f7a50" stroke-width="3"/>'+
    '<path d="M5 12L39 36L73 12" fill="none" stroke="#0f7a50" stroke-width="3" stroke-linejoin="round"/><circle cx="62" cy="44" r="7" fill="#ffc93c"/><text x="62" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#8f6514" font-family="Fredoka,sans-serif">$</text></svg>';
}
function buildPrint(){
  var f=cur(), cs=fnCounts(f), envs=activeEnvs();
  var h='<div class="p-head"><div class="p-env">'+envIcon()+'</div><div><div class="p-title">Budget <span>Envelopes</span></div><div class="p-sub">Fortnight '+dShort(f.start)+' – '+dShort(endOf(f))+' &middot; Printed '+new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div></div></div>';
  h+='<div class="p-sum"><div class="p-box main"><div class="l">Cash in all envelopes</div><div class="b">'+fmt(totalNow())+'</div></div>'+
    '<div class="p-box"><div class="l">🐷 Main Savings</div><div class="b" style="font-size:17pt">'+fmt(leftNow('savings'))+'</div><div class="s">'+(f.swept?'+'+fmt(f.swept)+' swept in this fortnight':'&nbsp;')+'</div></div>'+
    '<div class="p-box"><div class="l">Spent this fortnight</div><div class="b" style="font-size:17pt">'+fmt(Math.max(0,spentFn(f)))+'</div><div class="s">'+(cs.length?'last count '+dShort(tsDay(cs[cs.length-1].ts)):'no counts yet')+'</div></div></div>';
  var show=cs.slice(-4).reverse();
  h+='<div class="p-h2">This fortnight\'s counts</div><table class="p-table"><thead><tr><th class="d">Envelope</th>';
  show.forEach(function(c,i){h+='<th class="'+(i===0?'now':'')+'">'+dShort(tsDay(c.ts))+'</th>';});
  h+='<th>Start</th><th>Spent</th></tr></thead><tbody>';
  var tS=0;
  envs.forEach(function(e){
    h+='<tr><th class="d">'+e.emoji+' '+esc(e.name)+'</th>';
    show.forEach(function(c,i){var v=c.vals[e.id]; h+=v?'<td class="'+(i===0?'now':'')+'"><div class="n">'+fmt(v.amt)+'</div></td>':'<td class="z'+(i===0?' now':'')+'">–</td>';});
    var sp=e.savings?null:spentIn(f,e.id); if(sp>0) tS+=sp;
    h+='<td>'+fmt(f.base[e.id]||0)+'</td><td>'+(sp==null?'':sp>0?'<span class="down">'+fmt(sp)+'</span>':'<span class="same">–</span>')+'</td></tr>';
  });
  h+='<tr class="tot"><th class="d">Total</th>';
  show.forEach(function(c,i){h+='<td class="'+(i===0?'now':'')+'">'+fmt(countTotal(c).t)+'</td>';});
  h+='<td>'+fmt(envs.reduce(function(t,e){return t+(f.base[e.id]||0);},0))+'</td><td>'+fmt(tS)+'</td></tr></tbody></table>';
  var hist=S.fns.slice(1).slice(-8);
  if(hist.length){
    var W=700,H=150,top=22,bot=30,n=hist.length,max=Math.max.apply(null,hist.map(function(x){return x.swept||0;}).concat([1])),slot=W/n,bw=Math.min(56,slot*.6);
    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="'+(H-bot)+'" x2="'+W+'" y2="'+(H-bot)+'" stroke="#d9c6b2" stroke-width="1.5"/>';
    hist.forEach(function(x,i){var v=x.swept||0,bh=(H-top-bot)*(v/max),bx=slot*i+(slot-bw)/2,by=H-bot-bh;
      svg+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,1).toFixed(1)+'" rx="6" fill="'+(i===n-1?'#17a06b':'#a8e0c4')+'"/>'+
        '<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(by-6).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="600" fill="#2e2219" font-family="Fredoka,sans-serif">'+fmt(v)+'</text>'+
        '<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(H-bot+17)+'" text-anchor="middle" font-size="11" fill="#7a6556" font-family="Fredoka,sans-serif">'+pd(x.start).toLocaleDateString('en-AU',{day:'numeric',month:'short'})+'</text>';});
    h+='<div class="p-opt2"><div class="p-h2">Leftovers swept into savings</div><div class="p-chart">'+svg+'</div></div>';
  }
  h+='<div class="p-foot"><span>Counted by Oliver</span><b>Every dollar has a job!</b></div>';

// Scale the printout so it always fits on one A4 page (210x297mm less 12mm margins).

function fitPage(pv){

  var mm=pv.offsetWidth/186;
  function need(){return Math.min(1,(268*mm)/inner.scrollHeight,(186*mm)/inner.scrollWidth);}
  var z=need();
  ['.p-opt2'].forEach(function(sel){

}
